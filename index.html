<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galleria Profili - Party Edition</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 2rem;
      animation: rainbow 10s infinite linear;
      background-size: 400% 400%;
      position: relative;
      overflow-x: hidden;
    }

    @keyframes rainbow {
      0% { background-color: #ff0000; }
      20% { background-color: #ffa500; }
      40% { background-color: #ffff00; }
      60% { background-color: #00ff00; }
      80% { background-color: #0000ff; }
      100% { background-color: #8a2be2; }
    }

    h1 {
      text-align: center;
      color: white;
      text-shadow: 2px 2px 5px black;
    }

    form, .edit-form {
      max-width: 400px;
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: rgba(255, 255, 255, 0.9);
      padding: 1rem;
      border-radius: 1rem;
    }

    input, button {
      padding: 0.5rem;
      font-size: 1rem;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      margin-top: 3rem;
      justify-items: center;
    }

    .profile {
      text-align: center;
      background: rgba(255, 255, 255, 0.85);
      padding: 1rem;
      border-radius: 1rem;
      box-shadow: 0 0 10px #00000055;
    }

    .profile img {
      max-width: 100%;
      height: auto;
      border-radius: 0.5rem;
    }

    .falling-gifs {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      pointer-events: none;
      z-index: 1;
      mix-blend-mode: screen;
    }

    .falling-gif {
      position: absolute;
      top: -150px;
      animation: fall 12s linear infinite;
      height: 120px;
      opacity: 0.9;
      filter: drop-shadow(0 0 6px #ffffffaa);
    }

    @keyframes fall {
      0% {
        transform: translateY(0);
        opacity: 0.9;
      }
      100% {
        transform: translateY(100vh);
        opacity: 0;
      }
    }

    @media (max-width: 500px) {
      body {
        margin: 1rem;
      }
      form, .edit-form {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <h1>🎉 Galleria Profili Party 🎉</h1>

  <!-- 🎶 Musica di sottofondo -->
  <audio id="bg-music" loop>
    <source src="https://files.freemusicarchive.org/storage-freemusicarchive-org/music/no_curator/KieLoKaz/Free_Times_Vol_1/KieLoKaz_-_07_-_Hesitation.mp3" type="audio/mpeg">
    Il tuo browser non supporta l'audio HTML5.
  </audio>

  <!-- 🔘 Controllo musica -->
  <div style="text-align: center; margin-top: 1rem;">
    <button onclick="toggleMusic()" style="padding: 0.5rem 1rem; font-size: 1rem;">
      ▶️ Avvia Musica
    </button>
  </div>

  <form id="profile-form">
    <input type="text" name="name" placeholder="Nome" required />
    <input type="date" name="birthdate" required />
    <input type="file" name="image" accept="image/*" required />
    <button type="submit">Carica</button>
  </form>

  <p id="status" style="text-align: center; color: white; font-weight: bold;"></p>

  <div class="gallery" id="gallery"></div>

  <!-- 🎉 GIF che cascano dall’alto -->
  <div class="falling-gifs">
    <img class="falling-gif" src="https://media.tenor.com/A-jbUUs6UhoAAAAi/pixel-stars.gif" style="left: 8%;" alt="Pixel stars" />
    <img class="falling-gif" src="https://media.tenor.com/DfWv0biRwKoAAAAi/confetti.gif" style="left: 28%; animation-delay: 2s;" alt="Arcobaleno di coriandoli" />
    <img class="falling-gif" src="https://media.tenor.com/y2JXkY1pXkwAAAAi/cat-computer.gif" style="left: 48%; animation-delay: 4s;" alt="Gatto hacker" />
    <img class="falling-gif" src="https://media.tenor.com/-_f3qmrz9LEAAAAi/party-dinosaur.gif" style="left: 68%; animation-delay: 6s;" alt="Dinosauro festaiolo" />
    <img class="falling-gif" src="https://media.tenor.com/PyWldxZjOeMAAAAi/party-hat-confetti.gif" style="left: 88%; animation-delay: 8s;" alt="Cappellino di festa" />
  </div>

  <script>
    const BASE_URL = "https://galleria-profilo.onrender.com";
    const CACHE_KEY = "galleria-profiles-cache";

    function setStatus(message, isError = false) {
      const status = document.getElementById("status");
      status.textContent = message;
      status.style.color = isError ? "#ffdddd" : "#ddffdd";
    }

    function loadCachedProfiles() {
      try {
        const cached = localStorage.getItem(CACHE_KEY);
        return cached ? JSON.parse(cached) : [];
      } catch (err) {
        console.error("Errore nel leggere la cache", err);
        return [];
      }
    }

    function cacheProfiles(profiles) {
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify(profiles));
      } catch (err) {
        console.error("Errore nel salvare la cache", err);
      }
    }

    function renderProfiles(profiles) {
      const gallery = document.getElementById("gallery");
      gallery.innerHTML = "";
      profiles.forEach(profile => {
        const imgSrc = profile.imageData || `${BASE_URL}${profile.imageUrl}`;
        const div = document.createElement("div");
        div.className = "profile";
        div.innerHTML = `
          <img src="${imgSrc}" alt="${profile.name}" />
          <div><strong>${profile.name}</strong></div>
          <div>${profile.birthdate}</div>
          <button onclick="editProfile('${profile.id}', '${profile.name}', '${profile.birthdate}')">Modifica</button>
          <button onclick="deleteProfile('${profile.id}')">❌ Cancella</button>
        `;
        gallery.appendChild(div);
      });
    }

    function upsertCachedProfile(profile) {
      const cached = loadCachedProfiles();
      const idx = cached.findIndex(p => p.id === profile.id);
      if (idx >= 0) {
        cached[idx] = { ...cached[idx], ...profile };
      } else {
        cached.unshift(profile);
      }
      cacheProfiles(cached);
      renderProfiles(cached);
    }

    async function fetchProfiles() {
      try {
        const res = await fetch(`${BASE_URL}/profiles`);
        if (!res.ok) throw new Error("Richiesta non riuscita");
        const profiles = await res.json();
        const cached = loadCachedProfiles();
        const merged = profiles.map(p => {
          const cachedProfile = cached.find(c => c.id === p.id);
          return cachedProfile && cachedProfile.imageData ? { ...p, imageData: cachedProfile.imageData } : p;
        });
        cacheProfiles(merged);
        renderProfiles(merged);
        setStatus("Profili sincronizzati con il server.");
      } catch (err) {
        const cached = loadCachedProfiles();
        if (cached.length) {
          renderProfiles(cached);
          setStatus("Server non raggiungibile: sto mostrando i profili salvati in locale.", true);
        } else {
          setStatus("Errore nel caricamento dei profili. Riprova più tardi oppure verifica il backend.", true);
        }
        console.error(err);
      }
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    document.getElementById("profile-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);
      const name = formData.get("name");
      const birthdate = formData.get("birthdate");
      const imageFile = formData.get("image");

      let imageData;
      try {
        imageData = await fileToDataUrl(imageFile);
      } catch (err) {
        alert("Errore nel leggere l'immagine.");
        return;
      }

      let createdProfile = { id: `local-${Date.now()}`, name, birthdate, imageData };

      try {
        const res = await fetch(`${BASE_URL}/profiles`, {
          method: "POST",
          body: formData
        });

        if (res.ok) {
          const savedProfile = await res.json().catch(() => ({}));
          createdProfile = { ...savedProfile, name, birthdate, imageData };
          setStatus("Profilo salvato sul server e in locale.");
          fetchProfiles();
        } else {
          const errorText = await res.text().catch(() => "");
          setStatus(`Errore server (${res.status}). Salvo solo in locale. ${errorText}`, true);
        }
      } catch (err) {
        console.error("Upload fallito", err);
        setStatus("Server non raggiungibile, profilo salvato solo in locale.", true);
      }

      upsertCachedProfile(createdProfile);
      form.reset();
    });

    async function editProfile(id, currentName, currentDate) {
      const name = prompt("Modifica nome:", currentName);
      if (!name) return;
      const birthdate = prompt("Modifica data di nascita (YYYY-MM-DD):", currentDate);
      if (!birthdate) return;

      const cachedProfile = loadCachedProfiles().find(p => p.id === id);
      const cachedImageData = cachedProfile?.imageData;
      const cachedImageUrl = cachedProfile?.imageUrl;

      const formData = new FormData();
      formData.append("name", name);
      formData.append("birthdate", birthdate);

      const fileInput = document.createElement("input");
      fileInput.type = "file";
      fileInput.accept = "image/*";

      fileInput.onchange = async () => {
        const cacheUpdate = { id, name, birthdate };

        if (fileInput.files.length > 0) {
          formData.append("image", fileInput.files[0]);
          try {
            const imageData = await fileToDataUrl(fileInput.files[0]);
            cacheUpdate.imageData = imageData;
          } catch (err) {
            console.error("Impossibile aggiornare l'immagine in cache", err);
          }
        } else if (cachedImageData) {
          cacheUpdate.imageData = cachedImageData;
        } else if (cachedImageUrl) {
          cacheUpdate.imageUrl = cachedImageUrl;
        }

        upsertCachedProfile(cacheUpdate);

        try {
          const res = await fetch(`${BASE_URL}/profiles/${id}`, {
            method: "PUT",
            body: formData
          });

          if (res.ok) {
            setStatus("Profilo aggiornato.");
            fetchProfiles();
          } else {
            setStatus("Aggiornamento solo in locale (server non raggiungibile).", true);
          }
        } catch (err) {
          setStatus("Aggiornamento solo in locale (server non raggiungibile).", true);
        }
      };

      fileInput.click();
    }

    async function deleteProfile(id) {
      if (confirm("Sei sicuro di voler cancellare questo profilo?")) {
        const cached = loadCachedProfiles().filter(p => p.id !== id);
        cacheProfiles(cached);
        renderProfiles(cached);

        try {
          const res = await fetch(`${BASE_URL}/profiles/${id}`, {
            method: "DELETE"
          });
          if (res.ok) {
            setStatus("Profilo eliminato.");
            fetchProfiles();
          } else {
            setStatus("Profilo eliminato solo in locale (server non raggiungibile).", true);
          }
        } catch (err) {
          setStatus("Profilo eliminato solo in locale (server non raggiungibile).", true);
        }
      }
    }

    let isPlaying = false;
    function toggleMusic() {
      const audio = document.getElementById("bg-music");
      const btn = document.querySelector("button[onclick='toggleMusic()']");
      if (!isPlaying) {
        audio.play();
        btn.textContent = "⏸️ Pausa Musica";
      } else {
        audio.pause();
        btn.textContent = "▶️ Riprendi Musica";
      }
      isPlaying = !isPlaying;
    }

    renderProfiles(loadCachedProfiles());
    setStatus("Carico i profili...");
    fetchProfiles();
  </script>
</body>
</html>
